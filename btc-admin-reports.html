<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Store Insights — Beneath the Crescent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/btc-admin.css" />
</head>
<body>
  <div class="demo-banner">Demo data — sample numbers to show what's possible, not real store sales</div>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <h1>Beneath the Crescent</h1>
        <p>Store Insights</p>
        <div class="sync" id="syncNote">Synced with Clover</div>
      </div>
      <nav>
        <div class="nav-title">Today</div>
        <ul class="nav">
          <li><a href="#/dashboard" data-nav="dashboard">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
            <span class="lbl">Dashboard</span></a></li>
          <li><a href="#/calls" data-nav="calls">
            <svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1.9.4 1.8.7 2.7a2 2 0 01-.5 2.1L8 9.8a16 16 0 006 6l1.3-1.3a2 2 0 012.1-.4c.9.3 1.8.6 2.7.7a2 2 0 011.7 2z"/></svg>
            <span class="lbl">Call List</span><span class="badge" id="callBadge"></span></a></li>
          <li><a href="#/reports/restock" data-nav="restock">
            <svg viewBox="0 0 24 24"><path d="M3 3h18v4H3z"/><path d="M5 7v13h14V7"/><path d="M10 12h4"/></svg>
            <span class="lbl">Restock</span></a></li>
        </ul>
        <div class="nav-title">Store</div>
        <ul class="nav">
          <li><a href="#/inventory" data-nav="inventory">
            <svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
            <span class="lbl">Inventory</span></a></li>
          <li><a href="#/orders" data-nav="orders">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
            <span class="lbl">Orders</span></a></li>
          <li><a href="#/customers" data-nav="customers">
            <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
            <span class="lbl">Customers</span></a></li>
          <li><a href="#/reports/best" data-nav="reports">
            <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="5" width="3" height="13"/></svg>
            <span class="lbl">Reports</span></a></li>
        </ul>
      </nav>
    </aside>

    <main class="main" id="view"></main>
  </div>

  <div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
  <div class="toast" id="toast"></div>

  <!-- Chart.js is bundled locally so this works on the shop's tablet without internet -->
  <script src="js/vendor/chart.umd.min.js"></script>
  <!-- Swap btc-mock-data.js for the Clover API feed in the real version -->
  <script src="js/btc-mock-data.js"></script>
  <script src="js/btc-reports.js"></script>
  <script src="js/btc-admin.js"></script>
</body>
</html>
